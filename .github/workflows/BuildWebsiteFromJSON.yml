name: Build IGM Polls Site

on:
  # Rebuild automatically whenever you upload a new polls_data.json
  push:
    paths:
      - 'polls_data.json'
  workflow_dispatch:   # also allow a manual "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build HTML site
        run: python build_site.py

      - name: Commit updated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Rebuild site $(date -u +%Y-%m-%d)"
          git push
